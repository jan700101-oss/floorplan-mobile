<style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182d3b;font:15px system-ui}header{height:52px;padding:10px 14px;background:#172f40;color:white;display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}main{max-width:900px;margin:auto;padding:8px;display:flex;flex-direction:column;height:calc(100dvh - 52px);min-height:570px;gap:7px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;min-height:44px;border:1px solid #b8c8d1;border-radius:9px;padding:8px;background:white;color:#182d3b}button{cursor:pointer;touch-action:manipulation}button.primary{background:#086e7d;color:white;border:0}input{width:94px}label{font-size:14px}#canvas{width:100%;flex:1;min-height:180px;background:#f9fbfc;border:1px solid #d3dce3;border-radius:12px;touch-action:manipulation}#canvas text{font-family:system-ui}#message{margin:0;min-height:20px;font-size:13px;color:#086e7d}#walls{flex:1;min-width:0;width:100%}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.controls{background:white;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,46px);gap:4px}.pad button{padding:0;font-size:21px}.pad .up{grid-column:2;grid-row:1}.pad [data-dir="left"]{grid-column:1;grid-row:2}.pad #close{grid-column:2;grid-row:2}.pad [data-dir="right"]{grid-column:3;grid-row:2}.pad [data-dir="down"]{grid-column:2;grid-row:3}.pad #close{font-size:14px}.controls .entry{display:flex;flex-direction:column;gap:6px}.hint{font-size:13px;color:#506673;line-height:1.6}dialog{border:0;border-radius:18px 18px 0 0;padding:18px;max-width:560px;width:100%;max-height:85dvh;position:fixed;inset:auto 0 0;margin:0 auto;overflow:auto;box-shadow:0 -6px 32px #132f4020}dialog::backdrop{background:#152d4080}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h2{font-size:18px;margin:0}.fields{displa <header><h1>平面圖</h1><span style="font-size:12px">公分 cm</span></header>
<main><div class="row"><select id="walls" aria-label="選擇牆段"><option value="">尚未畫牆</option></select><button id="undo">復原</button><button id="fit" aria-label="圖面置中">置中</button></div><svg id="canvas" role="img" aria-label="可選取牆段的平面圖"></svg><p id="message" role="status" aria-live="polite">輸入牆長，按方向鍵畫牆；點牆後可加門窗。</p><div class="controls"><div class="entry"><label>牆長 <input id="length" type="number" inputmode="decimal" min="1" max="100000" value="300"> cm</label><span class="unit">中心線尺寸 · 可畫缺角</span></div><div class="pad"><button class="up" data-dir="up" aria-label="向上畫牆">↑</button><button data-dir="left" aria-label="向左畫牆">←</button><button id="close" aria-label="封閉房間">封閉</button><button data-dir="right" aria-label="向右畫牆">→</button><button style="grid-column:2" data-dir="down" aria-label="向下畫牆">↓</button></div></div><div class="tools"><button id="callDoor">＋門</button><button id="callWindow">＋窗</button><button data-open="wallDialog">牆體</button><button data-open="floorDialog">地坪</button><button data-open="projectDialog">檔案</button></div></main>
<dialog id="openingDialog" aria-labelledby="openingTitle"><div class="dialoghead"><h2 id="openingTitle">加入門</h2><button data-dismiss aria-label="關閉門窗面板">✕</button></div><p id="openingWall" class="hint"></p><select id="openingType"><option value="door">門</option><option value="window">窗</option></select><div id="doorPresets" class="presets"><button data-door="90" class="active">90 × 240</button><button data-door="120">120 × 240</button></div><div id="windowPresets" hidden><p class="hint">預設 DH 90；WH 120／130／140；W 120～240。單位 cm。</p><div class="presets"><button data-window="120">W 120</button><button data-window="140">W 140</button><button data-window="160">W 160</button><button data-window="180">W 180</button><button data-window="200">W 200</button><button data-window="220">W 220</button><button data-window="240">W 240</button></div><div class="presets"><button data-height="120">WH 120</button><button data-height="130">WH 130</button><button data-height="140">WH 140</button></div></div><div class="fields"><label>位置（距牆段起點）<input id="offset" type="number" inputmode="decimal" min="0" value="50"></label><label id="widthLabel">W 寬度<input id="width" type="number" inputmode="decimal" min="1" value="90"></label><label id="heightLabel">H 高度<input id="height" type="number" inputmode="decimal" min="1" value="240"></label><label id="sillField" hidden>DH 窗台離地高（暫定）<input id="sill" type="number" inputmode="decimal" min="0" value="90"></label><label id="sideField">門開啟側<select id="side"><option value="1">前進方向左側</option><option value="-1">前進方向右側</option></select></label></div><p class="hint">可直接修改預設數值。開口須位於牆內且不得重疊。</p><p id="openingError" role="status" class="error"></p><button class="primary wide" id="addOpening">加入門窗</button><details><summary>此牆已放置的門窗</summary><div id="openings"></div></details></dialog>
<dialog id="wallDialog" aria-labelledby="wallTitle"><div class="dialoghead"><h2 id="wallTitle">牆體設定</h2><button data-dismiss aria-label="關閉牆體面板">✕</button></div><div class="fields"><label>新牆厚度 cm<input id="thickness" type="number" inputmode="decimal" min="1" max="100" value="15"></label><label>牆材質<select id="wallMaterial"><option value="brick">磚牆</option><option value="concrete">混凝土</option><option value="partition">輕隔間</option></select></label></div><button id="setWallMaterial" class="wide">套用材質至選取牆</button><p id="wallError" class="error" role="status"></p><details><summary>新增房間起點</summary><div class="row"><label>X <input id="startX" type="number" inputmode="decimal" value="0"></label><label>Y <input id="startY" type="number" inputmode="decimal" value="0"></label><button id="newRoom">新增房間起點</button></div><p class="hint">X 向右、Y 向上為正；先前牆段保留。</p></details></dialog>
<dialog id="floorDialog" aria-labelledby="floorTitle"><div class="dialoghead"><h2 id="floorTitle">地坪材質</h2><button data-dismiss aria-label="關閉地坪面板">✕</button></div><p class="hint">選擇房間的材質，即時套用。可隨時從「地坪」重新修改。</p><div id="rooms"></div><p id="floorStatus" role="status" class="hint"></p><button class="primary wide" data-dismiss>完成</button></dialog>
<dialog id="projectDialog" aria-labelledby="projectTitle"><div class="dialoghead"><h2 id="projectTitle">檔案</h2><button data-dismiss aria-label="關閉檔案面板">✕</button></div><button class="primary wide" id="exportDxf">匯出 CAD（DXF）</button><button class="wide" id="save">儲存專案 JSON</button><button class="wide" id="load">載入專案</button><input hidden id="file" type="file" accept=".json,application/json"><button class="wide danger" id="reset">清空圖面</button><p id="fileError" class="error" role="status"></p><p class="hint">DXF 以毫米輸出，含門窗尺寸文字；高度為註記，非 3D 幾何。自動保存於此瀏覽器，請另存 JSON 備份。初步草圖尚未整理牆角及共用牆。</p></dialog>
<script>'use strict';
const $=id=>document.getElementById(id), EPS=1e-6;
let state={walls:[],rooms:[],cursor:{x:0,y:0},chain:[],selected:null},history=[],mode='draw';
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const names={brick:'磚牆',concrete:'混凝土',partition:'輕隔間',tile:'磁磚',wood:'木地板',cement:'水泥'};
const colors={brick:'#536477',concrete:'#343f4c',partition:'#7b6989',tile:'#d8e8ed',wood:'#ead9bc',cement:'#d8dadd'};
function msg(t){$('message').textContent=t}
function checkpoint(){history.push(JSON.stringify(state));if(history.length>100)history.shift()}
function persist(){try{localStorage.setItem('floorplan-v1',JSON.stringify(state))}catch{msg('瀏覽器無法自動保存，請另存 JSON。')}}
function len(w){return Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)}
function point(w,d){let l=len(w);return{x:w.a.x+(w.b.x-w.a.x)*d/l,y:w.a.y+(w.b.y-w.a.y)*d/l}}
function same(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<EPS}
function num(id,min,max){let v=Number($(id).value);if(!$(id).value.trim()||!Number.isFinite(v)||v<min||v>max)throw Error('請輸入有效數值：'+id);return v}
function action(fn){try{fn()}catch(e){msg(e.message);let dialog=document.querySelector('dialog[open]');let error=dialog&&dialog.querySelector('.error');if(error)error.textContent=e.message}}
function draw(dir){let l=num('length',1,100000),t=num('thickness',1,100),a={...state.cursor},b={...a};b.x+=(dir==='right'?l:dir==='left'?-l:0);b.y+=(dir==='up'?l:dir==='down'?-l:0);addWall(a,b,t)}
function addWall(a,b,t){if(state.walls.some(w=>(same(w.a,a)&&same(w.b,b))||(same(w.a,b)&&same(w.b,a))))throw Error('此牆段已存在。');checkpoint();let w={id:uid(),a,b,thickness:t,material:$('wallMaterial').value,openings:[]};state.walls.push(w);state.chain.push(w.id);state.cursor={...b};state.selected=w.id;render();msg('已畫牆 '+len(w)+' cm。')}
function roomPoints(ids){let ws=ids.map(id=>state.walls.find(w=>w.id===id));return ws.length?[ws[0].a,...ws.map(w=>w.b)]:[]}
function closeRoom(){let pts=roomPoints(state.chain);if(pts.length<3)throw Error('請先畫至少兩段牆。');let first=pts[0],last=state.cursor;if(!same(first,last)){if(first.x!==last.x&&first.y!==last.y)throw Error('起點與終點未在同一水平或垂直線，請再畫一段牆後封閉。');addWall({...last},{...first},num('thickness',1,100));}pts=roomPoints(state.chain);let area=pts.slice(0,-1).reduce((s,p,i)=>s+p.x*pts[i+1].y-pts[i+1].x*p.y,0)/2;if(Math.abs(area)<EPS)throw Error('房間面積為零，無法封閉。');checkpoint();state.rooms.push({id:uid(),walls:[...state.chain],material:'tile'});state.chain=[];render();msg('房間已封閉，請選擇地坪材質。');$('floorStatus').textContent='新建立：房間 '+state.rooms.length+'（預設磁磚，可更改）';$('floorDialog').showModal()}
function selected(){let w=state.walls.find(w=>w.id===state.selected);if(!w)throw Error('請先選取牆段。');return w}
function opening(){let w=selected(),offset=num('offset',0,100000),width=num('width',1,100000),height=num('height',1,100000),sill=$('openingType').value==='window'?num('sill',0,100000):0;if(offset+width>len(w)+EPS)throw Error('門窗超出牆長，請調整位置或寬度。');if(w.openings.some(o=>offset<o.offset+o.width-EPS&&offset+width>o.offset+EPS))throw Error('門窗與既有開口重疊。');checkpoint();w.openings.push({id:uid(),type:$('openingType').value,offset,width,height,sill,side:Number($('side').value)});render();msg('已加入'+($('openingType').value==='door'?'門':'窗')+'。');$('openingDialog').close()}
function segments(w){let start=0,result=[];for(let o of [...w.openings].sort((a,b)=>a.offset-b.offset)){if(o.offset>start)result.push([point(w,start),point(w,o.offset)]);start=o.offset+o.width}if(start<len(w))result.push([point(w,start),w.b]);return result}
function geom(w,o){let a=point(w,o.offset),b=point(w,o.offset+o.width),l=len(w),u={x:(w.b.x-w.a.x)/l,y:(w.b.y-w.a.y)/l},n={x:-u.y*o.side,y:u.x*o.side};return{a,b,u,n,end:{x:a.x+n.x*o.width,y:a.y+n.y*o.width}}}
function render(){persist();const svg=$('canvas');let pts=[state.cursor,...state.walls.flatMap(w=>[w.a,w.b])];let minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));let extent=Math.max(maxX-minX,maxY-minY,400),pad=extent*.18+40;svg.setAttribute('viewBox',`${minX-pad} ${-maxY-pad} ${maxX-minX+pad*2} ${maxY-minY+pad*2}`);svg.replaceChildren();let font=extent/32,stroke=extent/180;
 const el=(tag,attrs,parent=svg)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e};
 for(let r of state.rooms){let p=roomPoints(r.walls);el('polygon',{points:p.map(a=>`${a.x},${-a.y}`).join(' '),fill:colors[r.material],stroke:'none'});}
 for(let w of state.walls){for(let[a,b]of segments(w))el('line',{x1:a.x,y1:-a.y,x2:b.x,y2:-b.y,stroke:w.id===state.selected?'#087b8d':colors[w.material],'stroke-width':w.thickness});
 for(let o of w.openings){let g=geom(w,o);if(o.type==='window'){for(let d of [-w.thickness/3,0,w.thickness/3])el('line',{x1:g.a.x+g.n.x*d,y1:-g.a.y-g.n.y*d,x2:g.b.x+g.n.x*d,y2:-g.b.y-g.n.y*d,stroke:'#2989ba','stroke-width':stroke});}else{el('line',{x1:g.a.x,y1:-g.a.y,x2:g.end.x,y2:-g.end.y,stroke:'#b2762d','stroke-width':stroke});el('path',{d:`M ${g.b.x} ${-g.b.y} A ${o.width} ${o.width} 0 0 ${o.side===1?0:1} ${g.end.x} ${-g.end.y}`,fill:'none',stroke:'#b2762d','stroke-width':stroke});}}
 let mid=point(w,len(w)/2),txt=el('text',{x:mid.x+font*.6,y:-mid.y-font,fill:'#263e50','font-size':font});txt.textContent=`${Math.round(len(w)*100)/100} cm`;
 let hit=el('line',{x1:w.a.x,y1:-w.a.y,x2:w.b.x,y2:-w.b.y,stroke:'transparent','stroke-width':Math.max(w.thickness,extent/25),'pointer-events':'stroke'});hit.addEventListener('click',()=>{state.selected=w.id;render();msg('已選取牆段，可加入門窗或更改材質。')});}
 el('circle',{cx:state.cursor.x,cy:-state.cursor.y,r:font*.35,fill:'#d94a45'});
 $('walls').replaceChildren();if(!state.walls.length)$('walls').add(new Option('尚未畫牆',''));state.walls.forEach((w,i)=>$('walls').add(new Option(`${i+1}. ${len(w)} cm · ${names[w.material]}`,w.id)));$('walls').value=state.selected||'';
 let w=state.walls.find(w=>w.id===state.selected);if(w)$('wallMaterial').value=w.material;$('openings').replaceChildren();if(w)w.openings.forEach(o=>{let row=document.createElement('p');row.className='row hint';let s=document.createElement('span');s.textContent=`${o.type==='door'?'門':'窗'}：W ${o.width} / ${o.type==='door'?'H':'WH'} ${o.height??'待確認'}${o.type==='window'?' / DH '+(o.sill??'待確認'):''} · 位置 ${o.offset} cm`;let b=document.createElement('button');b.textContent='移除此開口';b.onclick=()=>{checkpoint();w.openings=w.openings.filter(a=>a.id!==o.id);render()};row.append(s,b);$('openings').append(row)});
 $('rooms').replaceChildren();if(!state.rooms.length)$('rooms').textContent='封閉房間後可指定地坪材質。';state.rooms.forEach((r,i)=>{let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.textContent=`房間 ${i+1}`;let sel=document.createElement('select');for(let m of ['tile','wood','cement'])sel.add(new Option(names[m],m));sel.value=r.material;sel.setAttribute('aria-label',`房間 ${i+1} 地坪材質`);sel.onchange=()=>{checkpoint();r.material=sel.value;render();let note=`房間 ${i+1} 已套用${names[r.material]}。`;$('floorStatus').textContent=note;msg(note)};row.append(label,sel);$('rooms').append(row)});
}
function dxf(s){let out=[],pair=(k,v)=>out.push(String(k),String(v)),scale=10;const layerNames=['WALL_brick','WALL_concrete','WALL_partition','DOOR','WINDOW','FLOOR_tile','FLOOR_wood','FLOOR_cement','DIM'];pair(0,'SECTION');pair(2,'HEADER');pair(9,'$ACADVER');pair(1,'AC1009');pair(0,'ENDSEC');pair(0,'SECTION');pair(2,'TABLES');pair(0,'TABLE');pair(2,'LAYER');pair(70,layerNames.length);layerNames.forEach((n,i)=>{pair(0,'LAYER');pair(2,n);pair(70,0);pair(62,[7,8,6,2,4,3,30,8,7][i]);pair(6,'CONTINUOUS')});pair(0,'ENDTAB');pair(0,'ENDSEC');pair(0,'SECTION');pair(2,'ENTITIES');
 const line=(a,b,layer)=>{pair(0,'LINE');pair(8,layer);pair(10,a.x*scale);pair(20,a.y*scale);pair(30,0);pair(11,b.x*scale);pair(21,b.y*scale);pair(31,0)};
 const wallMap=new Map(s.walls.map(w=>[w.id,w]));for(let r of s.rooms){let ws=r.walls.map(id=>wallMap.get(id));for(let w of ws)line(w.a,w.b,'FLOOR_'+r.material)}
 for(let w of s.walls){let l=len(w),n={x:-(w.b.y-w.a.y)/l*w.thickness/2,y:(w.b.x-w.a.x)/l*w.thickness/2};for(let[a,b]of segments(w)){let a1={x:a.x+n.x,y:a.y+n.y},a2={x:a.x-n.x,y:a.y-n.y},b1={x:b.x+n.x,y:b.y+n.y},b2={x:b.x-n.x,y:b.y-n.y};line(a1,b1,'WALL_'+w.material);line(a2,b2,'WALL_'+w.material);line(a1,a2,'WALL_'+w.material);line(b1,b2,'WALL_'+w.material)}for(let o of w.openings){let g=geom(w,o);if(o.type==='window'){for(let d of [-w.thickness/3,0,w.thickness/3])line({x:g.a.x+g.n.x*d,y:g.a.y+g.n.y*d},{x:g.b.x+g.n.x*d,y:g.b.y+g.n.y*d},'WINDOW')}else{line(g.a,g.end,'DOOR');let a=Math.atan2(g.u.y,g.u.x)*180/Math.PI,b=Math.atan2(g.n.y,g.n.x)*180/Math.PI;pair(0,'ARC');pair(8,'DOOR');pair(10,g.a.x*scale);pair(20,g.a.y*scale);pair(30,0);pair(40,o.width*scale);pair(50,((o.side===1?a:b)+360)%360);pair(51,((o.side===1?b:a)+360)%360)}let label=point(w,o.offset+o.width/2);pair(0,'TEXT');pair(8,o.type==='door'?'DOOR':'WINDOW');pair(10,label.x*scale);pair(20,(label.y-20)*scale);pair(30,0);pair(40,80);pair(1,(o.type==='door'?'D W':'WIN W')+o.width*scale+(o.height!==undefined?' H'+o.height*scale:' H?')+(o.type==='window'?(o.sill!==undefined?' DH'+o.sill*scale:' DH?'):''));pair(50,0)}let mid=point(w,l/2);pair(0,'TEXT');pair(8,'DIM');pair(10,mid.x*scale);pair(20,(mid.y+20)*scale);pair(30,0);pair(40,100);pair(1,String(Math.round(l*scale*100)/100)+' mm');pair(50,0)}pair(0,'ENDSEC');pair(0,'EOF');return out.join('\r\n')+'\r\n'}
function validate(s){if(!s||!Array.isArray(s.walls)||!Array.isArray(s.rooms)||!Array.isArray(s.chain)||s.walls.length>10000||s.rooms.length>10000)throw Error('專案檔案格式不正確。');let finite=n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e7,p=a=>a&&finite(a.x)&&finite(a.y);if(!p(s.cursor))throw Error('起點資料不正確。');let ids=new Set();for(let w of s.walls){if(typeof w.id!=='string'||ids.has(w.id)||!p(w.a)||!p(w.b)||len(w)<EPS||!(w.a.x===w.b.x||w.a.y===w.b.y)||!finite(w.thickness)||w.thickness<=0||!['brick','concrete','partition'].includes(w.material)||!Array.isArray(w.openings))throw Error('牆段資料不正確。');ids.add(w.id);let end=-1;for(let o of [...w.openings].sort((a,b)=>a.offset-b.offset)){if(!['door','window'].includes(o.type)||!finite(o.offset)||!finite(o.width)||o.offset<0||o.width<=0||o.offset+o.width>len(w)+EPS||o.offset<end-EPS||(o.height!==undefined&&(!finite(o.height)||o.height<=0))||(o.sill!==undefined&&(!finite(o.sill)||o.sill<0))||![1,-1].includes(o.side)||typeof o.id!=='string')throw Error('門窗資料不正確。');end=o.offset+o.width}}
